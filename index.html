<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام إدارة الإجازات - HS</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #f4f6f9;
            color: #333;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            background: #fff;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
        }

        header {
            text-align: center;
            border-bottom: 2px solid #eaeeeff;
            padding-bottom: 15px;
            margin-bottom: 20px;
        }

        header h1 {
            color: #1e293b;
            font-size: 24px;
        }

        .card {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .card h2 {
            font-size: 18px;
            color: #0f172a;
            margin-bottom: 15px;
            border-right: 4px solid #2563eb;
            padding-right: 10px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
            font-size: 14px;
        }

        input, select {
            width: 100%;
            padding: 10px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-size: 14px;
        }

        .btn {
            background-color: #2563eb;
            color: white;
            padding: 10px 18px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            transition: background 0.2s;
        }

        .btn:hover {
            background-color: #1d4ed8;
        }

        .btn-danger {
            background-color: #ef4444;
        }

        .btn-danger:hover {
            background-color: #dc2626;
        }

        .btn-warning {
            background-color: #f59e0b;
        }

        .btn-warning:hover {
            background-color: #d97706;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }

        th, td {
            text-align: right;
            padding: 12px;
            border-bottom: 1px solid #e2e8f0;
            font-size: 14px;
        }

        th {
            background-color: #f1f5f9;
            color: #475569;
        }

        .action-btns {
            display: flex;
            gap: 8px;
        }

        .hidden {
            display: none;
        }

        .nav-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .info-box {
            background: #e0f2fe;
            border-right: 4px solid #0284c7;
            padding: 15px;
            border-radius: 6px;
            margin-bottom: 15px;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>نظام إدارة الموظفين والإجازات (HS)</h1>
    </header>

    <!-- 1. شاشة تسجيل الدخول -->
    <div id="login-section" class="card">
        <h2>تسجيل الدخول</h2>
        <div class="form-group">
            <label>الكود:</label>
            <input type="text" id="login-code" placeholder="أدخل كود الموظف أو المدير">
        </div>
        <div class="form-group">
            <label>كلمة المرور:</label>
            <input type="password" id="login-pass" placeholder="أدخل كلمة المرور">
        </div>
        <button class="btn" onclick="login()">دخول</button>
    </div>

    <!-- 2. واجهة الموظف -->
    <div id="emp-panel" class="hidden">
        <div class="nav-bar">
            <h2>مرحباً، <span id="emp-welcome-name"></span></h2>
            <button class="btn btn-danger" onclick="logout()">تسجيل الخروج</button>
        </div>

        <div class="info-box">
            رصيد الإجازات المتبقي لديك: <strong><span id="emp-welcome-leave"></span></strong> يوم
        </div>

        <div class="card">
            <h2>تقديم طلب إجازة</h2>
            <div class="form-group">
                <label>نوع الإجازة:</label>
                <select id="leave-type">
                    <option value="سنوية">سنوية</option>
                    <option value="عارضة">عارضة</option>
                    <option value="مرضي">مرضي</option>
                </select>
            </div>
            <div class="form-group">
                <label>عدد الأيام المطلوب:</label>
                <input type="number" id="leave-days" min="1" value="1">
            </div>
            <button class="btn" onclick="requestLeave()">تقديم الطلب</button>
        </div>
    </div>

    <!-- 3. لوحة تحكم المدير -->
    <div id="admin-panel" class="hidden">
        <div class="nav-bar">
            <h2>لوحة تحكم الإدارة</h2>
            <button class="btn btn-danger" onclick="logout()">تسجيل الخروج</button>
        </div>

        <!-- إضافة موظف جديد -->
        <div class="card">
            <h2>إضافة موظف جديد</h2>
            <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px;">
                <div class="form-group">
                    <label>اسم الموظف:</label>
                    <input type="text" id="add-emp-name" placeholder="الاسم ثلاثي">
                </div>
                <div class="form-group">
                    <label>الكود الوظيفي:</label>
                    <input type="text" id="add-emp-code" placeholder="مثال: 101">
                </div>
                <div class="form-group">
                    <label>كلمة المرور:</label>
                    <input type="password" id="add-emp-pass" placeholder="كلمة المرور">
                </div>
                <div class="form-group">
                    <label>رصيد الإجازات:</label>
                    <input type="number" id="add-emp-leave" value="21">
                </div>
            </div>
            <button class="btn" onclick="addEmployee()">إضافة الموظف</button>
        </div>

        <!-- إدارة قائمة الموظفين -->
        <div class="card">
            <h2>قائمة الموظفين وتعديل البيانات</h2>
            <table>
                <thead>
                    <tr>
                        <th>الكود</th>
                        <th>الاسم</th>
                        <th>رصيد الإجازات</th>
                        <th>الإجراءات</th>
                    </tr>
                </thead>
                <tbody id="employee-table-body">
                    <!-- يتم التحميل ديناميكياً -->
                </tbody>
            </table>
        </div>
    </div>
</div>

<script>
    // البيانات الافتراضية
    const ADMIN_CODE = "admin";
    const ADMIN_PASS = "1234";

    let employees = JSON.parse(localStorage.getItem('hs_employees')) || [
        { code: "101", name: "أحمد محمود", pass: "123", leaveBalance: 21 },
        { code: "102", name: "محمد علي", pass: "123", leaveBalance: 14 }
    ];

    let currentLoggedInUser = null;

    function saveEmployees() {
        localStorage.setItem('hs_employees', JSON.stringify(employees));
    }

    function login() {
        const code = document.getElementById('login-code').value.trim();
        const pass = document.getElementById('login-pass').value.trim();

        if (!code || !pass) {
            alert('يرجى إدخال الكود وكلمة المرور!');
            return;
        }

        // تسجيل دخول المدير
        if (code === ADMIN_CODE && pass === ADMIN_PASS) {
            document.getElementById('login-section').classList.add('hidden');
            document.getElementById('admin-panel').classList.remove('hidden');
            renderEmployees();
            return;
        }

        // تسجيل دخول الموظف
        const foundEmp = employees.find(e => e.code === code && e.pass === pass);
        if (foundEmp) {
            currentLoggedInUser = foundEmp;
            document.getElementById('login-section').classList.add('hidden');
            document.getElementById('emp-panel').classList.remove('hidden');
            
            document.getElementById('emp-welcome-name').innerText = currentLoggedInUser.name;
            document.getElementById('emp-welcome-leave').innerText = currentLoggedInUser.leaveBalance;
        } else {
            alert('الكود أو كلمة المرور غير صحيحة!');
        }
    }

    function logout() {
        currentLoggedInUser = null;
        document.getElementById('login-section').classList.remove('hidden');
        document.getElementById('admin-panel').classList.add('hidden');
        document.getElementById('emp-panel').classList.add('hidden');
        document.getElementById('login-code').value = '';
        document.getElementById('login-pass').value = '';
    }

    // وظائف الموظف
    function requestLeave() {
        const days = parseInt(document.getElementById('leave-days').value);
        if (isNaN(days) || days <= 0) {
            alert('يرجى تحديد عدد أيام صحيح!');
            return;
        }

        if (days > currentLoggedInUser.leaveBalance) {
            alert('رصيدك الحالي لا يكفي لخصم هذه الأيام!');
            return;
        }

        currentLoggedInUser.leaveBalance -= days;
        saveEmployees();
        document.getElementById('emp-welcome-leave').innerText = currentLoggedInUser.leaveBalance;
        alert('تم تقديم الإجازة بنجاح وخصم الأيام من رصيدك!');
    }

    // وظائف لوحة المدير
    function renderEmployees() {
        const tbody = document.getElementById('employee-table-body');
        tbody.innerHTML = '';

        employees.forEach((emp, index) => {
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td>${emp.code}</td>
                <td>${emp.name}</td>
                <td><strong>${emp.leaveBalance}</strong> يوم</td>
                <td class="action-btns">
                    <button class="btn btn-warning" onclick="editLeave(${index})">تعديل الإجازات</button>
                    <button class="btn btn-danger" onclick="deleteEmployee(${index})">حذف</button>
                </td>
            `;
            tbody.appendChild(tr);
        });
    }

    function addEmployee() {
        const name = document.getElementById('add-emp-name').value.trim();
        const code = document.getElementById('add-emp-code').value.trim();
        const pass = document.getElementById('add-emp-pass').value.trim();
        const leave = parseInt(document.getElementById('add-emp-leave').value);

        if (!name || !code || !pass || isNaN(leave)) {
            alert('يرجى إكمال جميع الحقول بشكل صحيح!');
            return;
        }

        if (code === ADMIN_CODE || employees.some(e => e.code === code)) {
            alert('الكود مستخدم بالفعل! اختر كوداً آخر.');
            return;
        }

        employees.push({ name, code, pass, leaveBalance: leave });
        saveEmployees();
        renderEmployees();

        document.getElementById('add-emp-name').value = '';
        document.getElementById('add-emp-code').value = '';
        document.getElementById('add-emp-pass').value = '';
        document.getElementById('add-emp-leave').value = '21';

        alert('تمت إضافة الموظف بنجاح!');
    }

    function editLeave(index) {
        const currentBalance = employees[index].leaveBalance;
        const newBalance = prompt(`تعديل رصيد الإجازات لـ (${employees[index].name}):`, currentBalance);

        if (newBalance !== null && newBalance !== '') {
            const parsed = parseInt(newBalance);
            if (!isNaN(parsed) && parsed >= 0) {
                employees[index].leaveBalance = parsed;
                saveEmployees();
                renderEmployees();
                alert('تم التعديل بنجاح!');
            } else {
                alert('يرجى إدخال رقم صحيح!');
            }
        }
    }

    function deleteEmployee(index) {
        if (confirm(`هل أنت تأكد من حذف الموظف (${employees[index].name})؟`)) {
            employees.splice(index, 1);
            saveEmployees();
            renderEmployees();
        }
    }
</script>

</body>
</html>
