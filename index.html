<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>نظام رصيد الإجازات</title>
<style>
body{font-family:Tahoma;background:#0b1220;color:#fff;margin:0;padding:20px}
.card{background:#162033;padding:20px;border-radius:12px;margin:10px auto;max-width:1000px}
input,select,button{padding:10px;margin:5px;width:100%}
button{cursor:pointer}
table{width:100%;border-collapse:collapse}
th,td{border:1px solid #334;padding:8px;text-align:center}
.hidden{display:none}
</style>
</head>
<body>

<div id="login" class="card">
<h2>نظام رصيد الإجازات</h2>
<input id="code" placeholder="الكود">
<input id="pass" type="password" placeholder="كلمة المرور">
<button onclick="empLogin()">دخول الموظف</button>
<button onclick="adminLogin()">دخول الإدارة</button>
</div>

<div id="emp" class="card hidden">
<h2 id="empName"></h2>
<div id="balances"></div>
<h3>سجل الإجازات</h3>
<table><thead><tr><th>التاريخ</th><th>النوع</th><th>الأيام</th></tr></thead><tbody id="history"></tbody></table>
<button onclick="logout()">خروج</button>
</div>

<div id="admin" class="card hidden">
<h2>لوحة الإدارة</h2>

<h3>إضافة موظف</h3>
<input id="ncode" placeholder="الكود">
<input id="nname" placeholder="الاسم">
<input id="npass" placeholder="كلمة المرور">
<button onclick="addEmp()">إضافة</button>

<h3>خصم إجازة</h3>
<select id="empSel"></select>
<select id="type">
<option value="annual">اعتيادي</option>
<option value="casual">عارضة</option>
<option value="sick">مرضي</option>
</select>
<input id="days" type="number" placeholder="عدد الأيام">
<button onclick="vac()">خصم</button>

<h3>الموظفون</h3>
<table><thead><tr><th>الكود</th><th>الاسم</th><th>اعتيادي</th><th>عارضة</th><th>مرضي</th><th>حذف</th></tr></thead><tbody id="emps"></tbody></table>
<button onclick="logout()">خروج</button>
</div>

<script>
let employees=JSON.parse(localStorage.getItem('emps')||'null')||[
{code:'1339',password:'1234',name:'محمد سعد',annual:33,casual:10,sick:15,usedA:10,usedC:4,usedS:2,history:[]}
];
function save(){localStorage.setItem('emps',JSON.stringify(employees));}
function show(id){login.classList.add('hidden');emp.classList.add('hidden');admin.classList.add('hidden');document.getElementById(id).classList.remove('hidden');}
function empLogin(){
let e=employees.find(x=>x.code==code.value&&x.password==pass.value);
if(!e)return alert('بيانات غير صحيحة');
empName.innerText=e.name;
balances.innerHTML=`اعتيادي: ${e.annual-e.usedA} | عارضة: ${e.casual-e.usedC} | مرضي: ${e.sick-e.usedS}`;
history.innerHTML=e.history.map(h=>`<tr><td>${h.date}</td><td>${h.type}</td><td>${h.days}</td></tr>`).join('');
show('emp');
}
function adminLogin(){
if(prompt('كلمة مرور الإدارة')!=='1234') return;
loadAdmin(); show('admin');
}
function loadAdmin(){
empSel.innerHTML=''; emps.innerHTML='';
employees.forEach(e=>{
empSel.innerHTML+=`<option value="${e.code}">${e.name}</option>`;
emps.innerHTML+=`<tr><td>${e.code}</td><td>${e.name}</td><td>${e.annual-e.usedA}</td><td>${e.casual-e.usedC}</td><td>${e.sick-e.usedS}</td><td><button onclick="delEmp('${e.code}')">حذف</button></td></tr>`;
});
}
function addEmp(){
if(employees.some(e=>e.code===ncode.value)) return alert('الكود موجود');
employees.push({code:ncode.value,password:npass.value,name:nname.value,annual:30,casual:10,sick:15,usedA:0,usedC:0,usedS:0,history:[]});
save(); loadAdmin();
}
function delEmp(c){
employees=employees.filter(e=>e.code!==c); save(); loadAdmin();
}
function vac(){
let e=employees.find(x=>x.code===empSel.value);
let d=parseInt(days.value||0);
if(d<=0) return;
if(type.value==='annual'){
 if(d>(e.annual-e.usedA)) return alert('رصيد غير كاف');
 e.usedA+=d;
}
if(type.value==='casual'){
 if(d>(e.casual-e.usedC)) return alert('رصيد غير كاف');
 e.usedC+=d;
}
if(type.value==='sick'){
 if(d>(e.sick-e.usedS)) return alert('رصيد غير كاف');
 e.usedS+=d;
}
e.history.push({date:new Date().toLocaleDateString('ar-EG'),type:type.options[type.selectedIndex].text,days:d});
save(); loadAdmin(); alert('تم الخصم');
}
function logout(){show('login');}
save();
</script>
</body>
</html>
